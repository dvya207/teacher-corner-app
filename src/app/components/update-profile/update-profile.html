<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div class="modal-overlay" (click)="close()">
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
  <div
    class="profile-card animate-fade-up"
    role="dialog"
    aria-modal="true"
    aria-label="Update profile"
    (click)="$event.stopPropagation()"
  >

    <header class="profile-head">
      <h2>Update Profile</h2>
      <button type="button" class="modal-close" (click)="close()" aria-label="Close">
        <app-icon name="close" [size]="18" />
      </button>
    </header>

    <div class="profile-body">

      <span class="profile-avatar" aria-hidden="true">
        @if (loading()) {
          &nbsp;
        } @else {
          {{ initials() }}
        }
      </span>

      @if (error()) {
        <div class="profile-error" role="alert">{{ error() }}</div>
      }

      <div class="field-row">
        <div class="field">
          <label for="firstName">First Name</label>
          <div class="control">
            <span class="control-icon"><app-icon name="users" [size]="16" /></span>
            <input id="firstName" type="text" [value]="firstName()"
                   [disabled]="loading()"
                   [class.is-error]="!valid() && !loading()"
                   (input)="firstName.set(valueOf($event))" />
          </div>
        </div>

        <div class="field">
          <label for="lastName">Last Name</label>
          <div class="control">
            <span class="control-icon"><app-icon name="users" [size]="16" /></span>
            <input id="lastName" type="text" [value]="lastName()"
                   [disabled]="loading()"
                   (input)="lastName.set(valueOf($event))" />
          </div>
        </div>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <div class="control">
          <span class="control-icon"><app-icon name="mail" [size]="16" /></span>
          <input id="email" type="email" [value]="email()"
                 [disabled]="loading()"
                 (input)="email.set(valueOf($event))" />
          <span class="control-edit" aria-hidden="true"><app-icon name="edit" [size]="15" /></span>
        </div>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <div class="control">
          <span class="control-dial">
            <span class="flag" aria-hidden="true">🇮🇳</span>
            +91
            <app-icon name="chevron-down" [size]="13" />
          </span>
          <input id="phone" type="tel" inputmode="tel" [value]="phone()"
                 [disabled]="loading()"
                 (input)="phone.set(valueOf($event))" />
          <span class="control-edit" aria-hidden="true"><app-icon name="edit" [size]="15" /></span>
        </div>
      </div>

    </div>

    <footer class="profile-foot">
      <!-- Disabled until something actually changed, matching the reference.
           Re-saving an untouched profile is a write that costs a round trip and
           bumps the document for no reason. -->
      <button
        type="button"
        class="profile-save"
        [disabled]="loading() || saving() || !dirty() || !valid()"
        (click)="save()"
      >
        @if (saving()) {
          <span class="spinner" aria-hidden="true"></span>
          Updating...
        } @else {
          Update Profile
        }
      </button>
    </footer>

  </div>
</div>
